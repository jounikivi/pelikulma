<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>PELIKULMA</title>
    <link rel="stylesheet" href="./assets/menu.css" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Pelikulma: MATO ja LOISTE. Pienet selainpelit puhelimelle ja tietokoneelle."
    />
    <script src="./assets/menu.js" defer></script>
  </head>
  <body>
    <main>
      <h1>PELIKULMA</h1>
      <p class="sub">
        Pienet pelit, jotka toimivat puhelimella. Napauta ja pelaa.
      </p>
      <a class="card" href="./games/mato/index.html"
        ><div class="art mato">
          <i
            style="
              left: 22%;
              top: 38%;
              width: 46%;
              height: 20px;
              border-radius: 12px;
              background: linear-gradient(90deg, #2a9d8f, #3dffb0);
              box-shadow: 0 0 22px #3dffb0;
            "
          ></i>
          <i
            style="
              left: 22%;
              top: 38%;
              width: 20px;
              height: 60px;
              border-radius: 12px;
              background: #2a9d8f;
              box-shadow: 0 0 22px #3dffb055;
            "
          ></i>
          <i
            style="
              right: 20%;
              top: 30%;
              width: 18px;
              height: 18px;
              background: #ff4f9a;
              box-shadow: 0 0 20px #ff4f9a;
            "
          ></i>
          <i
            style="
              right: 34%;
              top: 62%;
              width: 14px;
              height: 14px;
              background: #ffd36b;
              box-shadow: 0 0 18px #ffd36b;
            "
          ></i>
        </div>
        <div class="shade"></div>
        <div class="info">
          <div>
            <b>MATO</b><span>Classic · Arcade · Maze · Time Attack</span>
          </div>
          <div class="pill" id="bm">Ennätys 0</div>
        </div></a
      >
      <a class="card" href="./games/loiste/index.html"
        ><div class="art loi">
          <i
            style="
              left: 50%;
              top: 22%;
              width: 46px;
              height: 46px;
              background: radial-gradient(circle at 35% 35%, #9ff, #146);
              box-shadow: 0 0 30px #4ad8ff88;
            "
          ></i>
          <i
            style="
              left: 22%;
              top: 56%;
              width: 60px;
              height: 60px;
              background: radial-gradient(circle at 35% 35%, #f9c, #703);
              box-shadow: 0 0 34px #ff4f9a88;
            "
          ></i>
          <i
            style="
              left: 72%;
              top: 58%;
              width: 30px;
              height: 30px;
              background: radial-gradient(circle at 35% 35%, #fe9, #a60);
              box-shadow: 0 0 24px #ffd36b88;
            "
          ></i>
          <i
            style="
              left: 62%;
              top: 34%;
              width: 8px;
              height: 8px;
              background: #fff;
              box-shadow: 0 0 14px #fff;
            "
          ></i>
        </div>
        <div class="shade"></div>
        <div class="info">
          <div><b>LOISTE</b><span>Napauta, lennä, pysy valossa</span></div>
          <div class="pill" id="bl">Ennätys 0</div>
        </div></a
      >
      <div class="soon">Lisää pelejä tulossa</div>
    </main>
  </body>
</html>
